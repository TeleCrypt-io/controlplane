name: build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: telecrypt_test
          POSTGRES_PASSWORD: telecrypt_test
          POSTGRES_DB: telecrypt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecrypt_test -d telecrypt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://telecrypt_test:telecrypt_test@127.0.0.1:5432/telecrypt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Synapse policy module image
        run: docker build --target synapse-tier-controller --tag telecrypt-synapse-tier-controller:test .

      - name: Test Synapse policy module image
        run: >-
          docker run --rm
          --user 0:0
          --entrypoint sh
          telecrypt-synapse-tier-controller:test
          -c 'python -m pip install --disable-pip-version-check pytest==9.0.2 pytest-asyncio==1.4.0 &&
          cd /modules/tier_controller &&
          python -c "from tier_controller import TierController" &&
          python -m pytest -q test_tier_controller.py'

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          target: controlplane
          tags: ghcr.io/telecrypt-io/telecrypt-controlplane:${{ github.ref_name }}

      - name: Build and push Synapse policy module
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          target: synapse-tier-controller
          tags: ghcr.io/telecrypt-io/telecrypt-synapse-tier-controller:${{ github.ref_name }}
