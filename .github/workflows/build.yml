name: build

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: telecrypt_test
          POSTGRES_PASSWORD: telecrypt_test
          POSTGRES_DB: telecrypt_test
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecrypt_test -d telecrypt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://telecrypt_test:telecrypt_test@127.0.0.1:5432/telecrypt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.4"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Set up Python for the Synapse policy module
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Build and test tier-controller wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0 pytest==9.0.2 pytest-asyncio==1.4.0
          python -m build --wheel --outdir dist/tier-controller synapse/tier_controller
          python -m venv /tmp/tier-controller-venv
          /tmp/tier-controller-venv/bin/python -m pip install --disable-pip-version-check matrix-synapse==1.159.0 pytest==9.0.2 pytest-asyncio==1.4.0 dist/tier-controller/*.whl
          /tmp/tier-controller-venv/bin/python -m pytest -q synapse/tier_controller/test_tier_controller.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    concurrency:
      group: controlplane-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated immutable release tag
        run: |
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Refuse to replace an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set +e
          inspection="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "GitHub Release $RELEASE already exists; refusing to replace release artifacts" >&2
            exit 1
          elif printf '%s\n' "$inspection" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            echo "confirmed immutable GitHub Release is unused: $RELEASE"
          else
            echo "cannot prove whether GitHub Release exists: $RELEASE" >&2
            exit 1
          fi

      - name: Set up Python for the tier-controller wheel
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Build the exact release wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build --wheel --outdir dist/tier-controller synapse/tier_controller

      - name: Require the wheel version to equal the release tag
        env:
          EXPECTED_RELEASE: ${{ github.ref_name }}
        run: |
          actual="$(python -c 'import tomllib; print(tomllib.load(open("synapse/tier_controller/pyproject.toml", "rb"))["project"]["version"])')"
          test "$actual" = "$EXPECTED_RELEASE" || {
            echo "tier-controller wheel version $actual does not equal release $EXPECTED_RELEASE" >&2
            exit 1
          }

      - name: Create tier-controller wheel checksum
        run: |
          shopt -s nullglob
          wheels=(dist/tier-controller/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one tier-controller wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          wheel="${wheels[0]##*/}"
          (cd dist/tier-controller && sha256sum "$wheel" > "$wheel.sha256")

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing image tag
        env:
          IMAGE: ghcr.io/telecrypt-io/controlplane:${{ github.ref_name }}
        run: |
          if inspection="$(docker manifest inspect "$IMAGE" 2>&1)"; then
            echo "refusing to replace existing immutable image tag $IMAGE" >&2
            exit 1
          elif printf '%s\n' "$inspection" | grep -Eqi 'manifest unknown|no such manifest|not found'; then
            echo "confirmed immutable image tag is unused: $IMAGE"
          else
            echo "cannot prove whether immutable image tag exists: $IMAGE" >&2
            exit 1
          fi

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/amd64
          provenance: true
          push: true
          target: controlplane
          tags: ghcr.io/telecrypt-io/controlplane:${{ github.ref_name }}

      - uses: sigstore/cosign-installer@v3.10.1

      - name: Sign image with cosign keyless
        env:
          IMAGE: ghcr.io/telecrypt-io/controlplane
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create immutable tier-controller wheel release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE" --verify-tag --title "tier-controller $RELEASE" --generate-notes dist/tier-controller/*.whl dist/tier-controller/*.whl.sha256
